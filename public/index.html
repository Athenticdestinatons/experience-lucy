<!DOCTYPE html>
<html>
<head>
<title>Experience Lucy</title>
<style>
body { font-family: system-ui, sans-serif; background:#0a0a0a; color:#fff; margin:0; padding:20px;}
#chat { max-width:600px; margin:auto;}
#messages { background:#1a1a1a; height:400px; overflow-y:scroll; padding:10px; border-radius:5px;}
.user { color:#88f; text-align:right;}
.lucy { color:#f88; }
input { width:70%; padding:10px; margin-top:10px;}
button { padding:10px 20px;}
</style>
</head>
<body>
<div id="chat">
<h1>Lucy ΣWARD</h1>
<div id="messages"></div>
<input id="msg" placeholder="Ask Lucy..." />
<button onclick="send()">Send</button>
</div>
<script>
const token = localStorage.getItem('CEO_TOKEN') || prompt("Enter CEO token:");
async function send(){
  const msg=document.getElementById('msg').value;
  if(!msg)return;
  addMessage('user',msg);
  const res=await fetch('/api/omega',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({command:'chat',args:{input:msg}})});
  const data=await res.json();
  addMessage('lucy','Presence acknowledged. (Command logged)');
}
function addMessage(who,text){const d=document.createElement('div');d.className=who;d.textContent=who+': '+text;document.getElementById('messages').appendChild(d);}
</script>
</body>
</html>
